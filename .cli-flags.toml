# flags-2-env surface for `cliptown-sidecar`
[identity]
service = "cliptown-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/cliptown/cliptown-sidecar.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[flags.bind]
env = "CLIPTOWN_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."
