[package]
org = "cliptown"
name = "cliptown-sidecar"
version = "0.1.0"
description = "k8s sidecar for Cliptown."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin cliptown-sidecar"
outputs = ["target/release/cliptown-sidecar"]

[bin]
cliptown-sidecar = "target/release/cliptown-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
